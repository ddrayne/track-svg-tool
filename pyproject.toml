[project]
name = "trackfactory"
version = "0.1.0"
description = "TrackFactory: resolve, ingest, normalize, QA, and render track maps"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "pydantic>=2.7.4",
  "numpy>=2.0.0",
  "shapely>=2.0.4",
  "pyproj>=3.6.1",
  "svgpathtools>=1.6.1",
  "lxml>=5.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
tf = "trackfactory.cli:app"

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trackfactory"]
